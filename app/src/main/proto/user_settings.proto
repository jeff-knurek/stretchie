syntax = "proto3";

package com.stretchie;

option java_multiple_files = true;

message PoseSettings {
  bool isSkipped = 1;
  int32 duration = 2;
  int32 intervalCount = 3;
}

message RoutinePoseConfig {
  bool included = 1;
  int32 duration = 2;
  int32 intervalCount = 3;
}

message RoutineConfig {
  string id = 1;
  string name = 2;
  map<string, RoutinePoseConfig> poseConfigs = 3;
}

message UserSettings {
  string intervalSound = 1;
  string poseChangeSound = 2;
  int32 intervalCount = 3;
  int32 intervalDuration = 4;
  map<string, PoseSettings> poseOverrides = 5;
  map<string, RoutineConfig> routines = 6;
}
